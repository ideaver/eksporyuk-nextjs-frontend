query CompanyDocumentFindMany(
  $where: CompanyDocumentWhereInput
  $orderBy: [CompanyDocumentOrderByWithRelationInput!]
  $take: Int
  $skip: Int
) {
  companyDocumentFindMany(
    where: $where
    orderBy: $orderBy
    take: $take
    skip: $skip
  ) {
    id
    name
    description
    instructionsForUse
    mainFunction
    companyDocumentTypeEnum
    createdAt
    updatedAt
    fileUrl
    companyId
  }
}
